name = "blunziger-chess-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "blunziger-chess-db"
database_id = "" # Set after `wrangler d1 create blunziger-chess-db`
migrations_dir = "migrations"

# Durable Object bindings
[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" },
  { name = "SCHEDULER", class_name = "Scheduler" },
]

[[migrations]]
tag = "v1"
new_classes = ["GameRoom", "Scheduler"]

# Cron trigger for periodic background tasks (room expiry, matchmaking)
[triggers]
crons = ["*/5 * * * *"]

# Environment variables (set via wrangler secret or dashboard)
# JWT_SECRET — signing key for JWTs
# OAUTH_GOOGLE_CLIENT_ID
# OAUTH_GOOGLE_CLIENT_SECRET
# OAUTH_GITHUB_CLIENT_ID
# OAUTH_GITHUB_CLIENT_SECRET
# OAUTH_DISCORD_CLIENT_ID
# OAUTH_DISCORD_CLIENT_SECRET
# OAUTH_MICROSOFT_CLIENT_ID
# OAUTH_MICROSOFT_CLIENT_SECRET
# FRONTEND_URL — e.g. https://blunziger-chess.pages.dev

[vars]
FRONTEND_URL = "https://blunziger-chess.pages.dev"
