syntax = "proto3";

package blunziger_chess;

option csharp_namespace = "BlunzigerChess.Proto";

import "common.proto";

// ── Simulation Service ───────────────────────────────────────────────

service SimulationService {
  // Run a complete bot-vs-bot game synchronously and return the game record
  rpc RunSimulatedGame(RunSimulatedGameRequest) returns (RunSimulatedGameResponse);

  // JSON passthrough variant — accepts/returns native frontend JSON to avoid
  // complex enum mapping on the .NET gateway side.
  rpc RunSimulatedGameJson(RunSimulatedGameJsonRequest) returns (RunSimulatedGameJsonResponse);
}

// ── Requests & Responses ─────────────────────────────────────────────

message RunSimulatedGameRequest {
  GameSetupConfig config = 1;
}
message RunSimulatedGameResponse {
  GameRecord record = 1;
}

message RunSimulatedGameJsonRequest {
  string config_json = 1;
}
message RunSimulatedGameJsonResponse {
  string record_json = 1;
}
