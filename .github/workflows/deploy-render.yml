name: Deploy to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify CONNECTION_STRING secret is configured
        run: |
          if [ -z "${{ secrets.CONNECTION_STRING }}" ]; then
            echo "::warning::CONNECTION_STRING secret is not set. Render will use its dashboard-configured value."
          else
            echo "CONNECTION_STRING secret is configured."
          fi

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Update Render environment variable
        if: ${{ secrets.CONNECTION_STRING != '' && secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e
          PAYLOAD=$(jq -n --arg val "$CONNECTION_STRING" '{value: $val}')
          RESPONSE=$(curl -sf -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/CONNECTION_STRING" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Render env var updated successfully."
