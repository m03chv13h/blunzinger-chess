name: System Tests

on:
  # Run after the deploy workflow completes
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types:
      - completed

  # Allow manual triggering with a custom target URL
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL to test against'
        required: false
        default: 'https://blunziger-frontend.onrender.com'

permissions:
  contents: read

jobs:
  system-tests:
    runs-on: ubuntu-latest
    # Only run on successful deploy or manual trigger
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run system tests
        run: npx playwright test
        env:
          BASE_URL: ${{ github.event.inputs.target_url || 'https://blunziger-frontend.onrender.com' }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
