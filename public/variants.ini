# Blunziger Chess — Custom Variant Definitions for Fairy-Stockfish (ffish.js)
#
# These variants extend Fairy-Stockfish with Blunziger Chess game modes.
# Loaded via ffish.loadVariantConfig() at engine initialization.
#
# mustCheck = true enables native forced-check enforcement in ffish when
# the WASM build supports it. If the build does not recognize this option,
# ffish silently ignores it and the app's authoritative rules engine in
# core/blunziger/ continues to enforce the mechanic as a fallback.
#
# Reverse Blunzinger uses mustCheckReverse = true (must avoid giving check
# when non-checking alternatives exist). This is only supported by custom
# blunznfish builds; standard Fairy-Stockfish ignores the option.

# ── Base Blunziger variants ──

# Classic Blunzinger — must give check if possible.
[blunziger:chess]
mustCheck = true

# Reverse Blunzinger — must avoid giving check if non-checking moves exist.
[blunziger_reverse:chess]
mustCheckReverse = true

# ── King Hunt variants (use checkCounting for check-based win conditions) ──

# King Hunt — Given Check Limit: first to reach N checks wins.
# checkCounting uses the 3check FEN format (e.g., "+0+0" appended to FEN).
[blunziger_kinghunt:chess]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 3+3 0 1
checkCounting = true
mustCheck = true

# ── Overlay combinations ──

# Blunziger + King of the Hill
[blunziger_koth:chess]
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunziger + Atomic Chess
[blunziger_atomic:atomic]
# Inherits all atomic rules (blast on capture, etc.)
mustCheck = true

# Blunziger + Crazyhouse
[blunziger_crazyhouse:crazyhouse]
# Inherits all crazyhouse rules (piece drops, captures to hand, etc.)
mustCheck = true

# Blunziger + Chess960
[blunziger_960:chess]
chess960 = true
mustCheck = true

# ── Multi-overlay combinations ──

# Blunziger + King of the Hill + Atomic
[blunziger_koth_atomic:atomic]
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunziger + Crazyhouse + King of the Hill
[blunziger_crazyhouse_koth:crazyhouse]
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunziger + King Hunt + King of the Hill
[blunziger_kinghunt_koth:chess]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 3+3 0 1
checkCounting = true
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunziger + Atomic + Crazyhouse
[blunziger_atomic_crazyhouse:crazyhouse]
blastOnCapture = true
mustCheck = true

# Blunziger + Chess960 + Crazyhouse
[blunziger_960_crazyhouse:crazyhouse]
chess960 = true
mustCheck = true

# Blunziger + Chess960 + King of the Hill
[blunziger_960_koth:chess]
chess960 = true
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# ── Reverse Blunziger overlay combinations ──

[blunziger_reverse_koth:chess]
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheckReverse = true

[blunziger_reverse_atomic:atomic]
mustCheckReverse = true

[blunziger_reverse_crazyhouse:crazyhouse]
mustCheckReverse = true

[blunziger_reverse_960:chess]
chess960 = true
mustCheckReverse = true
