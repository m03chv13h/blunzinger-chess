# Blunziger Chess — Custom Variant Definitions for Fairy-Stockfish (ffish.js)
#
# These variants extend Fairy-Stockfish with Blunziger Chess game modes.
# Loaded via ffish.loadVariantConfig() at engine initialization.
#
# mustCheck = true enables native forced-check enforcement in ffish. When a
# checking move exists, only checking moves are legal. The updated blunznfish
# WASM build (v0.1) supports this option natively. The app's authoritative
# rules engine in core/blunziger/ continues to enforce the mechanic as well.
#
# NOTE: mustCheck is incompatible with the `:atomic` base variant. Atomic
# variants must inherit from `:chess` and set `blastOnCapture = true` instead.
#
# Reverse Blunzinger (must avoid giving check) is NOT natively supported by
# ffish. The `mustCheckReverse` option is ignored by the engine. The app's
# rules engine enforces the reverse mechanic entirely.

# ── Base Blunziger variants ──

# Classic Blunzinger — must give check if possible.
[blunziger:chess]
mustCheck = true

# ── King Hunt variants (use checkCounting for check-based win conditions) ──

# King Hunt — Given Check Limit: first to reach N checks wins.
# checkCounting uses the 3check FEN format (e.g., "+0+0" appended to FEN).
[blunziger_kinghunt:chess]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 3+3 0 1
checkCounting = true
mustCheck = true

# ── Overlay combinations ──

# Blunziger + King of the Hill
[blunziger_koth:chess]
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunziger + Atomic Chess
# NOTE: Inherits from chess (not atomic) with blastOnCapture, because
# mustCheck is incompatible with the :atomic base variant.
[blunziger_atomic:chess]
blastOnCapture = true
mustCheck = true

# Blunziger + Crazyhouse
[blunziger_crazyhouse:crazyhouse]
mustCheck = true

# Blunziger + Chess960
[blunziger_960:chess]
chess960 = true
mustCheck = true

# ── Multi-overlay combinations ──

# Blunziger + King of the Hill + Atomic
[blunziger_koth_atomic:chess]
blastOnCapture = true
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunziger + Crazyhouse + King of the Hill
[blunziger_crazyhouse_koth:crazyhouse]
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunziger + King Hunt + King of the Hill
[blunziger_kinghunt_koth:chess]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 3+3 0 1
checkCounting = true
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunziger + Atomic + Crazyhouse
[blunziger_atomic_crazyhouse:crazyhouse]
blastOnCapture = true
mustCheck = true

# Blunziger + Chess960 + Crazyhouse
[blunziger_960_crazyhouse:crazyhouse]
chess960 = true
mustCheck = true

# Blunziger + Chess960 + King of the Hill
[blunziger_960_koth:chess]
chess960 = true
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true
