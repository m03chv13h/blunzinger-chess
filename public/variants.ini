# Blunziger Chess — Custom Variant Definitions for Fairy-Stockfish (ffish.js)
#
# These variants extend Fairy-Stockfish with Blunziger Chess game modes.
# Loaded via ffish.loadVariantConfig() at engine initialization.
#
# Fairy-Stockfish does not have a native "mustCheck" option, so the forced-check
# rule (the core Blunziger mechanic) is enforced by the app's authoritative rules
# engine in core/blunziger/. The variants below configure overlay-specific rules
# that ffish CAN handle natively (atomic, crazyhouse, king of the hill, 3check, etc.)
# to provide better move generation and evaluation for those overlays.

# ── Base Blunziger variants (standard chess rules — forced-check is app-side) ──

# Classic Blunzinger / Reverse Blunzinger — standard chess base.
# Forced-check rule is enforced by the app, not by ffish.
[blunziger:chess]
# No additional rules — standard chess with app-side forced-check enforcement.

# ── King Hunt variants (use checkCounting for check-based win conditions) ──

# King Hunt — Given Check Limit: first to reach N checks wins.
# checkCounting uses the 3check FEN format (e.g., "+0+0" appended to FEN).
[blunziger_kinghunt:chess]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 3+3 0 1
checkCounting = true

# ── Overlay combinations ──

# Blunziger + King of the Hill
[blunziger_koth:chess]
flagPiece = k
flagRegion = d4 e4 d5 e5

# Blunziger + Atomic Chess
[blunziger_atomic:atomic]
# Inherits all atomic rules (blast on capture, etc.)

# Blunziger + Crazyhouse
[blunziger_crazyhouse:crazyhouse]
# Inherits all crazyhouse rules (piece drops, captures to hand, etc.)

# Blunziger + Chess960
[blunziger_960:chess]
chess960 = true

# ── Multi-overlay combinations ──

# Blunziger + King of the Hill + Atomic
[blunziger_koth_atomic:atomic]
flagPiece = k
flagRegion = d4 e4 d5 e5

# Blunziger + Crazyhouse + King of the Hill
[blunziger_crazyhouse_koth:crazyhouse]
flagPiece = k
flagRegion = d4 e4 d5 e5

# Blunziger + King Hunt + King of the Hill
[blunziger_kinghunt_koth:chess]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 3+3 0 1
checkCounting = true
flagPiece = k
flagRegion = d4 e4 d5 e5

# Blunziger + Atomic + Crazyhouse
[blunziger_atomic_crazyhouse:crazyhouse]
blastOnCapture = true

# Blunziger + Chess960 + Crazyhouse
[blunziger_960_crazyhouse:crazyhouse]
chess960 = true

# Blunziger + Chess960 + King of the Hill
[blunziger_960_koth:chess]
chess960 = true
flagPiece = k
flagRegion = d4 e4 d5 e5
