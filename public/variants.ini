# Blunzinger Chess — Custom Variant Definitions for Fairy-Stockfish (ffish.js)
#
# These variants extend Fairy-Stockfish with Blunzinger Chess game modes.
# Loaded via ffish.loadVariantConfig() at engine initialization.
#
# mustCheck = true enables native forced-check enforcement in ffish. When a
# checking move exists, only checking moves are legal. The updated blunznfish
# WASM build (v0.1) supports this option natively. The app's authoritative
# rules engine in core/blunzinger/ continues to enforce the mechanic as well.
#
# NOTE: mustCheck is incompatible with the `:atomic` base variant. Atomic
# variants must inherit from `:chess` and set `blastOnCapture = true` instead.
#
# Reverse Blunzinger (must avoid giving check) is NOT natively supported by
# ffish. The `mustCheckReverse` option is ignored by the engine. The app's
# rules engine enforces the reverse mechanic entirely.

# ── Base Blunzinger variants ──

# Classic Blunzinger — must give check if possible.
[blunzinger:chess]
mustCheck = true

# ── King Hunt variants (use checkCounting for check-based win conditions) ──

# King Hunt — Given Check Limit: first to reach N checks wins.
# checkCounting uses the 3check FEN format (e.g., "+0+0" appended to FEN).
[blunzinger_kinghunt:chess]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 3+3 0 1
checkCounting = true
mustCheck = true

# ── Overlay combinations ──

# Blunzinger + King of the Hill
[blunzinger_koth:chess]
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunzinger + Atomic Chess
# NOTE: Inherits from chess (not atomic) with blastOnCapture, because
# mustCheck is incompatible with the :atomic base variant.
[blunzinger_atomic:chess]
blastOnCapture = true
mustCheck = true

# Blunzinger + Crazyhouse
[blunzinger_crazyhouse:crazyhouse]
mustCheck = true

# Blunzinger + Chess960
[blunzinger_960:chess]
chess960 = true
mustCheck = true

# ── Multi-overlay combinations ──

# Blunzinger + King of the Hill + Atomic
[blunzinger_koth_atomic:chess]
blastOnCapture = true
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunzinger + Crazyhouse + King of the Hill
[blunzinger_crazyhouse_koth:crazyhouse]
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunzinger + King Hunt + King of the Hill
[blunzinger_kinghunt_koth:chess]
startFen = rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 3+3 0 1
checkCounting = true
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true

# Blunzinger + Atomic + Crazyhouse
[blunzinger_atomic_crazyhouse:crazyhouse]
blastOnCapture = true
mustCheck = true

# Blunzinger + Chess960 + Crazyhouse
[blunzinger_960_crazyhouse:crazyhouse]
chess960 = true
mustCheck = true

# Blunzinger + Chess960 + King of the Hill
[blunzinger_960_koth:chess]
chess960 = true
flagPiece = k
flagRegion = d4 e4 d5 e5
mustCheck = true
