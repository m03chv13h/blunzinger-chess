# Render Blueprint — Blunziger Chess
# https://render.com/docs/blueprint-spec

services:
  # ── Frontend (Static Site) ────────────────────────────────────────
  - type: web
    name: blunziger-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DEPLOY_MODE
        value: connected
      # Set this to the public URL of the blunziger-api service
      # (e.g. https://blunziger-api.onrender.com).  Do NOT use fromService
      # here — its `host` property returns a private hostname that browsers
      # cannot resolve.
      - key: VITE_API_BASE_URL
        sync: false

  # ── .NET API Backend ──────────────────────────────────────────────
  - type: web
    name: blunziger-api
    runtime: docker
    dockerfilePath: backend/dotnet-api/BlunzigerChess.Api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: CONNECTION_STRING
        sync: false  # Set to external PostgreSQL connection URI
      - key: NodeWorker__Url
        fromService:
          type: pserv
          name: blunziger-node-worker
          property: hostport
      - key: Jwt__Secret
        generateValue: true
      - key: OAuth__Google__ClientId
        sync: false
      - key: OAuth__Google__ClientSecret
        sync: false
      - key: OAuth__GitHub__ClientId
        sync: false
      - key: OAuth__GitHub__ClientSecret
        sync: false
      - key: OAuth__Discord__ClientId
        sync: false
      - key: OAuth__Discord__ClientSecret
        sync: false
      - key: OAuth__Microsoft__ClientId
        sync: false
      - key: OAuth__Microsoft__ClientSecret
        sync: false
      # Set this to the public URL of the blunziger-frontend service
      # (e.g. https://blunziger-frontend.onrender.com).  Do NOT use
      # fromService — its `host` property returns a private hostname,
      # not the public origin the browser sends in CORS requests.
      - key: Cors__AllowedOrigins__0
        sync: false

  # ── Node.js Game Engine Worker (Private Service) ──────────────────
  - type: pserv
    name: blunziger-node-worker
    runtime: docker
    dockerfilePath: backend/node-worker/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "50051"
      - key: HOST
        value: "0.0.0.0"
